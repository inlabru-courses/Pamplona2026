<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the precision matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen instrument. Controls on top, mesh and matrix side by side, a single readout strip underneath. */
:root {
  --paper: #F3F5F6;
  --panel: #FFFFFF;
  --ink: #17202A;
  --muted: #5A6774;
  --rule: #D6DDE3;
  --mesh: #9AA6B1;
  --pos: #1F5A8A;
  --neg: #C8553D;
  --sel: #D1495B;
  --c-size: #0E8A87;
  --c-slope: #C27A05;
  --c-curv: #8A4A9B;
  --focus: #2F6FDE;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--panel); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--rule); }
button { font: 500 12.5px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
button:hover { background: var(--paper); }
button:focus-visible, input:focus-visible, svg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
button:disabled { opacity: 0.45; cursor: default; }
.slider { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.slider input { width: 150px; accent-color: var(--ink); }
.slider output { font-family: var(--mono); color: var(--ink); min-width: 9ch; font-variant-numeric: tabular-nums; }
.slider.off { opacity: 0.45; }
.panes { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; min-height: 0; }
.pane { border: 1px solid var(--rule); border-radius: 10px; padding: 6px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 4px; min-height: 0; min-width: 0; }
.pane h2 { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.box { position: relative; min-height: 0; }
.box svg, .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#mesh { cursor: pointer; touch-action: none; }
.strip { display: grid; gap: 6px; }
.readout { margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.readout b { font-weight: 600; }
.bar { display: flex; height: 20px; border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); font: 500 11.5px/20px var(--mono); color: #fff; }
.bar span { display: block; text-align: center; white-space: nowrap; overflow: hidden; }
.bar-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.bar-row[hidden] { display: none !important; }
@media (max-width: 480px) {
  html, body { height: auto; }
  .wrap { height: auto; }
  .panes { grid-template-columns: minmax(0, 1fr); }
  .pane { height: 320px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="controls">
    <div class="seg" role="group" aria-label="Which matrix to show">
      <button data-mode="C" aria-pressed="false">C</button>
      <button data-mode="G" aria-pressed="false">G</button>
      <button data-mode="G2" aria-pressed="false">G C⁻¹ G</button>
      <button data-mode="Q" aria-pressed="true">Q</button>
      <button data-mode="draw" aria-pressed="false">Draw w</button>
    </div>
    <label class="slider" id="sliderWrap">range ρ
      <input type="range" id="rho" min="0.3" max="6" step="0.05" value="2">
      <output id="rhoOut" for="rho"></output>
    </label>
    <button id="newDraw">New draw</button>
  </div>

  <div class="panes">
    <section class="pane" aria-labelledby="mesh-h">
      <h2 id="mesh-h">Mesh (click a node)</h2>
      <div class="box"><svg id="mesh" tabindex="0" role="application" aria-label="Mesh; click a node to show its row of the matrix"></svg></div>
    </section>
    <section class="pane" aria-labelledby="mat-h">
      <h2 id="mat-h">Matrix</h2>
      <div class="box"><canvas id="mat" aria-label="Heat map of the selected matrix"></canvas></div>
    </section>
  </div>

  <div class="strip">
    <p class="readout" id="readout" aria-live="polite"></p>
    <div class="bar-row" id="barRow">
      <span>Q<sub>ii</sub> =</span>
      <div class="bar" id="bar"></div>
    </div>
  </div>
</div>

      if (j === i || Math.abs(M[i][j]) < 1e-12) continue;
      const direct = Math.abs(G[i][j]) > 1e-12;
      if (direct) mk("line", { x1: P[i][0], y1: P[i][1], x2: P[j][0], y2: P[j][1], stroke: css(mode === "G" ? "--c-slope" : "--c-curv"), "stroke-width": 3 }, gHi);
      nodeEls[j].setAttribute("fill", css(mode === "G" ? "--c-slope" : "--c-curv"));
      nodeEls[j].setAttribute("stroke", "var(--panel)");
      nodeEls[j].setAttribute("r", direct ? 7 : 5.5);
      if (!direct) nodeEls[j].setAttribute("fill", mix(css("--c-curv"), 0.55));
    }
  } else if (mode === "Q") {
    const Q = cur.Q, qii = Q[i][i];
    let mx = 0; for (let j = 0; j < N; j++) if (j !== i) mx = Math.max(mx, Math.abs(Q[i][j] / qii));
    for (let j = 0; j < N; j++) {
      if (j === i || Math.abs(Q[i][j]) < 1e-12) continue;
      const wgt = -Q[i][j] / qii, a = 0.25 + 0.75 * Math.abs(wgt) / (mx || 1);
      nodeEls[j].setAttribute("fill", mix(wgt > 0 ? pos : neg, a));
      nodeEls[j].setAttribute("stroke", "var(--panel)");
      nodeEls[j].setAttribute("r", 4 + 4 * Math.abs(wgt) / (mx || 1));
    }
  } else if (mode === "draw") {
    D.tv.forEach((t, k) => { const m = (w[t[0]] + w[t[1]] + w[t[2]]) / 3; fillEls[k].setAttribute("fill", viridis((m + 2.5) / 5)); });
    nodeEls.forEach(c => c.setAttribute("r", 0));
  }
  const c = nodeEls[i];
  c.setAttribute("fill", "var(--sel)"); c.setAttribute("stroke", "var(--panel)"); c.setAttribute("r", 7);
  gNodes.appendChild(c);
  selLabel.textContent = i + 1;
  selLabel.setAttribute("x", P[i][0] + 10); selLabel.setAttribute("y", P[i][1] - 10);
}

/* ---------- matrix view ---------- */
const cv = document.getElementById("mat"), ctx = cv.getContext("2d");
function currentMatrix() { return { C: CM, G: G, G2: G2, Q: cur.Q, draw: cur.Q }[state.mode]; }
function drawMatrix() {
  const box = cv.parentElement, dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth, H = box.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--panel"); ctx.fillRect(0, 0, W, H);
  const M = currentMatrix(), i = state.sel;
  const lab = 46, side = Math.max(10, Math.min(W - lab - 4, H - lab - 4)), cell = side / N;
  const ox = lab + (W - lab - side) / 2, oy = 2;
  let mx = 0; for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) mx = Math.max(mx, Math.abs(M[a][b]));
  const pos = css("--pos"), neg = css("--neg");
  ctx.strokeStyle = css("--rule"); ctx.lineWidth = 1; ctx.strokeRect(ox - 0.5, oy - 0.5, side + 1, side + 1);
  for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) {
    const v = M[a][b]; if (Math.abs(v) < 1e-12) continue;
    const t = Math.sqrt(Math.abs(v) / mx);
    ctx.fillStyle = mix(v > 0 ? pos : neg, 0.25 + 0.75 * t);
    ctx.fillRect(ox + b * cell, oy + a * cell, Math.max(cell, 1.2), Math.max(cell, 1.2));
  }
  ctx.strokeStyle = css("--sel"); ctx.lineWidth = 1.5;
  ctx.strokeRect(ox - 1, oy + i * cell - 1, side + 2, cell + 2);
  ctx.fillStyle = css("--muted"); ctx.font = "500 11px 'IBM Plex Sans', sans-serif";
  ctx.textAlign = "right"; ctx.fillText("row " + (i + 1), ox - 3, oy + (i + 0.5) * cell + 4);
  ctx.textAlign = "center"; ctx.fillText(`${N} × ${N} · ${(100 * nz(M) / (N * N)).toFixed(0)}% non-zero`, ox + side / 2, oy + side + 14);
}

/* ---------- readout ---------- */
const ro = document.getElementById("readout"), barRow = document.getElementById("barRow"), bar = document.getElementById("bar");
function renderReadout() {
  const i = state.sel, n = i + 1, s = sub(n);
  const k = cur.kappa.toFixed(2), r = state.rho.toFixed(2);
  if (state.mode === "C") {
    ro.innerHTML = `<b>C${s},${s} = ${C[i].toFixed(2)}</b>: the area owned by node ${n} (one third of the triangles around it). C is diagonal. It depends on the mesh only.`;
  } else if (state.mode === "G") {
    ro.innerHTML = `<b>Row ${n} of G</b>: ${rowNz(G, i)} non-zeros, node ${n} and its ${rowNz(G, i) - 1} neighbours (they share an edge). The row sums to 0, so a flat surface costs nothing. Mesh only.`;
  } else if (state.mode === "G2") {
    ro.innerHTML = `<b>Row ${n} of G C⁻¹ G</b> (curvature): ${rowNz(G2, i)} non-zeros, neighbours and their neighbours. Mesh only.`;
  } else {
    const Q = cur.Q, qii = Q[i][i];
    let sum = 0; for (let j = 0; j < N; j++) if (j !== i) sum += -Q[i][j] / qii;
    const head = `ρ = ${r} → κ = √8/ρ = ${k}. <b>Q = τ²(κ⁴C + 2κ²G + G C⁻¹ G)</b>`;
    ro.innerHTML = state.mode === "Q"
      ? `${head}. Row ${n}: ${rowNz(Q, i)} of ${N} non-zero. E[w${s} | rest] = Σⱼ (−Q${s},ⱼ / Q${s},${s}) wⱼ: the neighbours carry <b>${Math.round(100 * sum)}%</b> of the weight.`
      : `${head}. One draw of <b>w ~ N(0, Q⁻¹)</b>. Move the slider: the same draw gets smoother as ρ grows, rougher as it shrinks.`;
  }
  const showBar = state.mode === "Q" || state.mode === "draw";
  barRow.hidden = !showBar;
  if (showBar) {
    const a = cur.k4 * C[i], b = cur.k2 * G[i][i], c = G2[i][i], t = a + b + c;
    const seg = (v, col, name) => { const p = 100 * v / t; return `<span style="width:${p}%;background:${col}" title="${name} ${p.toFixed(0)}%">${p >= 14 ? name + " " + p.toFixed(0) + "%" : ""}</span>`; };
    bar.innerHTML = seg(a, css("--c-size"), "size κ⁴C") + seg(b, css("--c-slope"), "slope 2κ²G") + seg(c, css("--c-curv"), "curvature");
  }
}

/* ---------- controls ---------- */
const rhoIn = document.getElementById("rho"), rhoOut = document.getElementById("rhoOut"), sliderWrap = document.getElementById("sliderWrap"), newDraw = document.getElementById("newDraw");
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));
rhoIn.addEventListener("input", () => { state.rho = +rhoIn.value; cur = buildQ(state.rho); w = sampleW(cur.Q, z); render(); });
newDraw.addEventListener("click", () => { state.seed += 1; z = normals(state.seed); w = sampleW(cur.Q, z); if (state.mode !== "draw") state.mode = "draw"; render(); });
svg.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); state.sel = (state.sel + (e.key === "ArrowRight" ? 1 : N - 1)) % N; render(); }
});

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  const meshOnly = ["C", "G", "G2"].includes(state.mode);
  rhoIn.disabled = meshOnly; sliderWrap.classList.toggle("off", meshOnly);
  newDraw.disabled = state.mode !== "draw" && state.mode !== "Q";
  rhoOut.textContent = state.rho.toFixed(2);
  document.getElementById("mat-h").textContent = { C: "Matrix C", G: "Matrix G", G2: "Matrix G C⁻¹ G", Q: "Matrix Q", draw: "Matrix Q" }[state.mode];
  drawMesh(); drawMatrix(); renderReadout();
}
new ResizeObserver(drawMatrix).observe(cv.parentElement);
render();
</script>
</body>
</html>
