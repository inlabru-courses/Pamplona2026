<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basis functions and the A matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table tool. Mesh plan and 3D view side by side, the A matrix as a full-width ledger underneath. */
:root {
  --paper: #F3F5F6;
  --panel: #FFFFFF;
  --ink: #17202A;
  --muted: #5A6774;
  --rule: #D6DDE3;
  --mesh: #8C99A5;
  --c1: #0E8A87;
  --c2: #C27A05;
  --c3: #8A4A9B;
  --pt: #D1495B;
  --pt-other: #4A5563;
  --focus: #2F6FDE;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; padding: 6px; }
.wrap { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 em { font-style: italic; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.lede b { color: var(--ink); font-weight: 500; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 8px; min-height: 0; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; min-width: 0; align-content: start; }
#plan { grid-template-rows: auto minmax(0, 1fr); align-content: stretch; min-height: 0; }
#view { grid-template-rows: auto auto minmax(0, 1fr); align-content: stretch; min-height: 0; }
.cv-box { position: relative; min-height: 0; }
.cv-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h2 { font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; color: var(--muted); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
#plan svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#plan svg:focus-visible, canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.obs { cursor: grab; }
.obs:active { cursor: grabbing; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--rule); }
button {
  font: 500 12px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
button:hover { background: var(--paper); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
canvas { width: 100%; display: block; touch-action: none; cursor: grab; border-radius: 6px; }
canvas:active { cursor: grabbing; }
.readout { font-family: var(--mono); font-size: 13px; line-height: 1.6; margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.readout .k1 { color: var(--c1); } .readout .k2 { color: var(--c2); } .readout .k3 { color: var(--c3); }
.readout .tot { font-weight: 500; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--rule); white-space: nowrap; }
thead th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
tbody th { text-align: left; font-weight: 500; }
tbody tr { cursor: pointer; }
tbody tr.sel th { color: var(--pt); }
tbody tr.sel { outline: 2px solid var(--pt); outline-offset: -2px; }
td.zero { color: var(--rule); }
td.sum, th.sum, td.z, th.z { border-left: 1px solid var(--rule); }
tfoot th, tfoot td { color: var(--muted); border-bottom: 0; }
tfoot th { text-align: left; font-weight: 500; }
.note { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 90ch; }
.note code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="grid">
    <section class="panel" id="plan" aria-labelledby="plan-h">
      <div class="panel-head">
        <h2 id="plan-h">Mesh from above</h2>
      </div>
      <svg id="planSvg" tabindex="0" role="application" aria-label="Mesh with draggable observation points"></svg>
    </section>

    <section class="panel" id="view" aria-labelledby="view-h">
      <div class="panel-head">
        <h2 id="view-h">3D view (drag to rotate)</h2>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="What to show">
          <button id="modeBasis" aria-pressed="true">Basis functions at s</button>
          <button id="modeField" aria-pressed="false">Field Z(s) = A w</button>
        </div>
        <button id="newDraw">New draw of w</button>
        <button id="resetView">Reset view</button>
      </div>
      <div class="cv-box"><canvas id="cv" tabindex="0" aria-label="3D view of the basis functions or the interpolated field"></canvas></div>
    </section>
  </div>

  <section class="panel" id="matrix" aria-labelledby="mat-h">
    <div class="panel-head">
      <h2 id="mat-h">Projector matrix A (rows = observations, columns = mesh nodes)</h2>
    </div>
    <div class="table-wrap"><table id="Atab"></table></div>
    <p class="readout" id="readout" aria-live="polite"></p>
    <p class="readout" id="calc" hidden></p>
  </section>
</div>

<script>
const MESH = {"loc":[[2.008,0.642],[0.902,1.925],[-0.372,2.14],[-1.696,1.463],[-2.032,-0.132],[-1.717,-1.281],[-0.208,-2.022],[0.972,-1.633],[1.969,-0.741],[0.05,-0.03],[1.097,0.16],[0.293,1.061],[-0.754,0.669],[-1.083,-0.208],[-0.379,-1.027],[0.732,-0.814]],"tv":[[14,9,13],[1,11,0],[6,7,14],[7,8,15],[13,5,14],[12,9,11],[11,2,12],[10,0,11],[10,15,8],[11,1,2],[4,13,12],[7,15,14],[9,14,15],[13,4,5],[9,12,13],[10,8,0],[15,10,9],[3,4,12],[3,12,2],[6,14,5],[9,10,11]],"w":[[-3.24,0.19,-3.24,-1.81,-0.72,2,-1.4,-0.52,-1.59,-2.07,-1.97,-1.45,-1.63,0.02,-0.82,-1.45],[-2.25,-2.29,-2.07,0.32,-1.06,-2.11,-2.28,-1.34,-1.3,-1.49,-1.52,-1.59,-0.98,-1.21,-2.21,-1.77],[0.18,-1,-1.25,-0.84,3.03,-0.49,-0.46,-2.92,-3.84,-0.4,-0.52,-0.77,1.4,1.14,-0.79,-2.42],[0.28,-2,-0.51,-1.73,-1.98,-0.68,1.98,-0.22,-0.34,-0.47,0.54,-1.21,-2.5,-2.52,0.87,-0.93]]};
const N = MESH.loc.length;
const SUB = ["₀","₁","₂","₃","₄","₅","₆","₇","₈","₉"];
const sub = n => String(n).split("").map(d => SUB[+d]).join("");
const fmt = (v, d = 2) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);

const state = {
  pts: [[0.42, 0.34], [-1.25, 0.85], [1.35, -0.85], [-0.62, -1.62]],
  sel: 0, mode: "basis", draw: 0, az: -0.65, el: 0.6
};

function bary(p, t) {
  const [a, b, c] = t.map(i => MESH.loc[i]);
  const det = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
  const l1 = ((b[1] - c[1]) * (p[0] - c[0]) + (c[0] - b[0]) * (p[1] - c[1])) / det;
  const l2 = ((c[1] - a[1]) * (p[0] - c[0]) + (a[0] - c[0]) * (p[1] - c[1])) / det;
  return [l1, l2, 1 - l1 - l2];
}
function locate(p) {
  for (let k = 0; k < MESH.tv.length; k++) {
    const l = bary(p, MESH.tv[k]);
    if (l.every(v => v >= -1e-9)) return { tri: k, w: l.map(v => Math.max(0, v)) };
  }
  return null;
}
state.pts = state.pts.map((p, k) => {
  if (locate(p)) return p;
  const t = MESH.tv[k * 5 % MESH.tv.length].map(i => MESH.loc[i]);
  return [(t[0][0] + t[1][0] + t[2][0]) / 3, (t[0][1] + t[1][1] + t[2][1]) / 3];
});

function Arow(p) {
  const r = new Array(N).fill(0); const L = locate(p);
  if (!L) return { row: r, L: null };
  MESH.tv[L.tri].forEach((i, j) => { r[i] = L.w[j]; });
  return { row: r, L };
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CORNER = ["--c1", "--c2", "--c3"];

/* ---------- Plan view (SVG) ---------- */
const svg = document.getElementById("planSvg");
const NS = "http://www.w3.org/2000/svg";
const xs = MESH.loc.map(p => p[0]), ys = MESH.loc.map(p => p[1]);
const pad = 0.45;
const bx = [Math.min(...xs) - pad, Math.max(...xs) + pad], by = [Math.min(...ys) - pad, Math.max(...ys) + pad];
const SC = 100;
svg.setAttribute("viewBox", `0 0 ${(bx[1] - bx[0]) * SC} ${(by[1] - by[0]) * SC}`);
const X = x => (x - bx[0]) * SC, Y = y => (by[1] - y) * SC;
const unX = u => u / SC + bx[0], unY = v => by[1] - v / SC;
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }

const gSub = el("g", {}), gTri = el("g", {}), gNodes = el("g", {}), gObs = el("g", {});
MESH.tv.forEach(t => el("polygon", { points: t.map(i => `${X(MESH.loc[i][0])},${Y(MESH.loc[i][1])}`).join(" "), fill: "none", stroke: "var(--mesh)", "stroke-width": 1.2 }, gTri));
const nodeEls = MESH.loc.map((p, i) => {
  const g = el("g", {}, gNodes);
  const c = el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 5, fill: "var(--panel)", stroke: "var(--mesh)", "stroke-width": 1.5 }, g);
  const t = el("text", { x: X(p[0]) + 8, y: Y(p[1]) - 8, "font-family": "var(--mono)", "font-size": 15, fill: "var(--muted)" }, g);
  t.textContent = i + 1;
  return { c, t };
});
const obsEls = state.pts.map((p, k) => {
  const g = el("g", { class: "obs", "data-k": k }, gObs);
  const hit = el("circle", { r: 20, fill: "transparent" }, g);
  const c = el("circle", { r: 8, "stroke-width": 2 }, g);
  const t = el("text", { "font-family": "var(--body)", "font-size": 17, "font-weight": 600 }, g);
  t.textContent = "s" + sub(k + 1);
  return { g, hit, c, t };
});

function drawPlan() {
  gSub.innerHTML = "";
  const p = state.pts[state.sel]; const L = locate(p);
  nodeEls.forEach(n => { n.c.setAttribute("fill", "var(--panel)"); n.c.setAttribute("stroke", "var(--mesh)"); n.c.setAttribute("r", 5); n.t.setAttribute("fill", "var(--muted)"); n.t.setAttribute("font-weight", 400); });
  if (L) {
    const t = MESH.tv[L.tri];
    t.forEach((i, j) => {
      const others = t.filter((_, m) => m !== j).map(m => MESH.loc[m]);
      el("polygon", { points: [p, ...others].map(q => `${X(q[0])},${Y(q[1])}`).join(" "), fill: `var(${CORNER[j]})`, "fill-opacity": 0.28, stroke: "none" }, gSub);
      el("line", { x1: X(p[0]), y1: Y(p[1]), x2: X(MESH.loc[i][0]), y2: Y(MESH.loc[i][1]), stroke: "var(--pt)", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gSub);
      const n = nodeEls[i];
      n.c.setAttribute("fill", `var(${CORNER[j]})`); n.c.setAttribute("stroke", `var(${CORNER[j]})`); n.c.setAttribute("r", 7);
      n.t.setAttribute("fill", `var(${CORNER[j]})`); n.t.setAttribute("font-weight", 600);
    });
  }
  obsEls.forEach((o, k) => {
    const q = state.pts[k], s = k === state.sel;
    o.hit.setAttribute("cx", X(q[0])); o.hit.setAttribute("cy", Y(q[1]));
    o.c.setAttribute("cx", X(q[0])); o.c.setAttribute("cy", Y(q[1]));
    o.c.setAttribute("fill", s ? "var(--pt)" : "var(--pt-other)");
    o.c.setAttribute("stroke", "var(--panel)");
    o.t.setAttribute("x", X(q[0]) + 11); o.t.setAttribute("y", Y(q[1]) + 20);
    o.t.setAttribute("fill", s ? "var(--pt)" : "var(--pt-other)");
  });
  gObs.appendChild(obsEls[state.sel].g);
}

let drag = null;
function svgPoint(evt) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [unX(q.x), unY(q.y)];
}
obsEls.forEach((o, k) => {
  o.g.addEventListener("pointerdown", e => { e.preventDefault(); state.sel = k; drag = k; svg.setPointerCapture(e.pointerId); svg.focus({ preventScroll: true }); render(); });
});
svg.addEventListener("pointermove", e => {
  if (drag === null) return;
  const p = svgPoint(e);
  if (locate(p)) { state.pts[drag] = p; render(); }
});
const endDrag = () => { drag = null; };
svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);
svg.addEventListener("keydown", e => {
  const d = { ArrowLeft: [-0.05, 0], ArrowRight: [0.05, 0], ArrowUp: [0, 0.05], ArrowDown: [0, -0.05] }[e.key];
  if (e.key === "Tab" && e.shiftKey === false) return;
  if (e.key === "n") { state.sel = (state.sel + 1) % state.pts.length; render(); return; }
  if (!d) return;
  e.preventDefault();
  const p = state.pts[state.sel], q = [p[0] + d[0], p[1] + d[1]];
  if (locate(q)) { state.pts[state.sel] = q; render(); }
});

/* ---------- 3D view (canvas, orthographic) ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const R = 2.6;
const VIR = ["#440154", "#3b528b", "#21918c", "#5ec962", "#fde725"];
function hexToRgb(h) { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function viridis(t) {
  t = Math.min(1, Math.max(0, t)); const f = t * (VIR.length - 1), i = Math.min(VIR.length - 2, Math.floor(f)), u = f - i;
  const a = hexToRgb(VIR[i]), b = hexToRgb(VIR[i + 1]);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * u)).join(",")})`;
}
function withAlpha(color, a) {
  if (color.startsWith("#")) { const [r, g, b] = hexToRgb(color); return `rgba(${r},${g},${b},${a})`; }
  return color.replace("rgb(", "rgba(").replace(")", `,${a})`);
}
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const box = cv.parentElement;
  W = box.clientWidth; H = box.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw3d();
}
let ZC = 0, CX = 0, CY = 0, RS = R;
function proj(x, y, z) {
  const ca = Math.cos(state.az), sa = Math.sin(state.az), ce = Math.cos(state.el), se = Math.sin(state.el);
  const u = (x - CX) / RS, v = (y - CY) / RS, xr = u * ca - v * sa, yr = u * sa + v * ca, zz = z - ZC;
  const s = Math.min(W * 0.42, H * 0.58);
  return { X: W / 2 + xr * s, Y: H / 2 - (yr * se + zz * ce) * s, d: -yr * ce + zz * se };
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.X, p.Y) : ctx.moveTo(p.X, p.Y)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function line(a, b, color, lw, dash) { ctx.beginPath(); ctx.setLineDash(dash || []); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); ctx.setLineDash([]); }
function label(p, text, color, dx, dy, font) {
  ctx.font = font || "500 13px 'IBM Plex Mono', monospace";
  const x = p.X + (dx || 0), y = p.Y + (dy || 0);
  ctx.lineJoin = "round"; ctx.strokeStyle = css("--panel"); ctx.lineWidth = 4; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function draw3d() {
  if (!W) return;
  const ink = css("--ink"), mesh = css("--mesh"), muted = css("--muted"), pt = css("--pt"), ptOther = css("--pt-other"), panel = css("--panel");
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = panel; ctx.fillRect(0, 0, W, H);
  const p = state.pts[state.sel], A = Arow(p);
  if (state.mode === "basis") {
    const Zs = 0.62; ZC = Zs / 2; CX = p[0]; CY = p[1]; RS = 1.7;
    MESH.tv.forEach(t => poly(t.map(i => proj(MESH.loc[i][0], MESH.loc[i][1], 0)), null, withAlpha(mesh, 0.7), 1));
    if (A.L) {
      const corners = MESH.tv[A.L.tri];
      const faces = [];
      corners.forEach((c, j) => {
        const col = css(CORNER[j]);
        MESH.tv.forEach(t => {
          if (!t.includes(c)) return;
          const v = t.map(i => proj(MESH.loc[i][0], MESH.loc[i][1], i === c ? Zs : 0));
          faces.push({ v, d: v.reduce((s, q) => s + q.d, 0) / 3, col });
        });
      });
      faces.sort((a, b) => a.d - b.d).forEach(f => poly(f.v, withAlpha(f.col, 0.28), withAlpha(f.col, 0.95), 1.2));
      corners.forEach((c, j) => {
        const top = proj(MESH.loc[c][0], MESH.loc[c][1], Zs);
        label(top, "ψ" + sub(c + 1), css(CORNER[j]), -12, -8, "600 14px 'IBM Plex Mono', monospace");
      });
      const base = proj(p[0], p[1], 0);
      const dot = (q, r, col) => { ctx.beginPath(); ctx.arc(q.X, q.Y, r, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = panel; ctx.lineWidth = 1.5; ctx.stroke(); };
      /* each basis function's own height scale: a pole from its node (0) to its peak (1) */
      corners.forEach((c, j) => {
        const q = MESH.loc[c];
        line(proj(q[0], q[1], 0), proj(q[0], q[1], Zs), css(CORNER[j]), 1.5);
      });
      /* the vertical line at s, up to the largest value */
      line(base, proj(p[0], p[1], Math.max(...A.L.w) * Zs), pt, 2.2);
      /* dashed level lines: value of each basis function at s, carried back to its own pole */
      corners.forEach((c, j) => {
        const q = MESH.loc[c], h = A.L.w[j] * Zs, col = css(CORNER[j]);
        const a = proj(q[0], q[1], h), b = proj(p[0], p[1], h);
        line(a, b, col, 1.8, [6, 4]);
        dot(a, 3.5, col);
        dot(b, 5, col);
        const m = { X: b.X + (a.X - b.X) * 0.55, Y: b.Y + (a.Y - b.Y) * 0.55 };
        label(m, A.L.w[j].toFixed(2), col, -14, -7, "600 13px 'IBM Plex Mono', monospace");
      });
      dot(base, 5, pt);
      label(base, "s" + sub(state.sel + 1), pt, 8, 16, "600 14px 'IBM Plex Sans', sans-serif");
      /* the three values stacked: they always add up to 1 */
      const bh = Math.min(140, H * 0.42), bx0 = W - 46, by0 = 34 + bh;
      let yb = by0;
      corners.forEach((c, j) => {
        const seg = A.L.w[j] * bh;
        ctx.fillStyle = css(CORNER[j]); ctx.fillRect(bx0, yb - seg, 16, seg); yb -= seg;
      });
      ctx.strokeStyle = ink; ctx.lineWidth = 1; ctx.strokeRect(bx0 + 0.5, by0 - bh + 0.5, 15, bh - 1);
      label({ X: bx0 - 6, Y: by0 - bh - 10 }, "Σ = 1", ink, 0, 0, "600 13px 'IBM Plex Mono', monospace");
      label({ X: bx0 - 8, Y: by0 + 18 }, "at s" + sub(state.sel + 1), muted, 0, 0, "400 12px 'IBM Plex Sans', sans-serif");
    }
  } else {
    const w = MESH.w[state.draw]; CX = 0; CY = 0; RS = R;
    const wmin = Math.min(...w), wmax = Math.max(...w);
    const Zs = 0.9 / (wmax - wmin || 1), floor = wmin * Zs - 0.2;
    ZC = (floor + wmax * Zs) / 2;
    MESH.tv.forEach(t => poly(t.map(i => proj(MESH.loc[i][0], MESH.loc[i][1], floor)), null, withAlpha(mesh, 0.55), 1));
    const faces = MESH.tv.map(t => {
      const v = t.map(i => proj(MESH.loc[i][0], MESH.loc[i][1], w[i] * Zs));
      const m = t.reduce((s, i) => s + w[i], 0) / 3;
      return { v, d: v.reduce((s, q) => s + q.d, 0) / 3, col: viridis((m - wmin) / (wmax - wmin || 1)) };
    });
    faces.sort((a, b) => a.d - b.d).forEach(f => poly(f.v, withAlpha(f.col, 0.9), withAlpha(ink, 0.35), 0.8));
    MESH.loc.forEach((q, i) => { const a = proj(q[0], q[1], w[i] * Zs); ctx.beginPath(); ctx.arc(a.X, a.Y, 2.5, 0, 2 * Math.PI); ctx.fillStyle = ink; ctx.fill(); });
    state.pts.forEach((q, k) => {
      const r = Arow(q); if (!r.L) return;
      const z = r.row.reduce((s, a, i) => s + a * w[i], 0);
      const sel = k === state.sel, col = sel ? pt : ptOther;
      const b = proj(q[0], q[1], floor), t = proj(q[0], q[1], z * Zs);
      line(b, t, col, sel ? 2.4 : 1.4, sel ? [] : [4, 3]);
      ctx.beginPath(); ctx.arc(b.X, b.Y, sel ? 5 : 4, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill();
      ctx.beginPath(); ctx.arc(t.X, t.Y, sel ? 6 : 4.5, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = panel; ctx.lineWidth = 1.5; ctx.stroke();
      label(t, "Z(s" + sub(k + 1) + ")", col, 9, -6, sel ? "600 13px 'IBM Plex Mono', monospace" : "400 12px 'IBM Plex Mono', monospace");
    });
  }
  label({ X: 12, Y: H - 12 }, state.mode === "basis" ? "basis functions ψᵢ evaluated at the selected point" : `surface Σ ψᵢ(s) wᵢ, draw ${state.draw + 1} of ${MESH.w.length}`, muted, 0, 0, "400 12px 'IBM Plex Sans', sans-serif");
}

let rot = null;
cv.addEventListener("pointerdown", e => { rot = [e.clientX, e.clientY, state.az, state.el]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!rot) return;
  state.az = rot[2] + (e.clientX - rot[0]) * 0.01;
  state.el = Math.min(1.5, Math.max(0.12, rot[3] + (e.clientY - rot[1]) * 0.01));
  draw3d();
});
const endRot = () => { rot = null; };
cv.addEventListener("pointerup", endRot); cv.addEventListener("pointercancel", endRot);
cv.addEventListener("keydown", e => {
  const m = { ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, -0.08], ArrowDown: [0, 0.08] }[e.key];
  if (!m) return; e.preventDefault();
  state.az += m[0]; state.el = Math.min(1.5, Math.max(0.12, state.el + m[1])); draw3d();
});

/* ---------- Readouts and the A table ---------- */
const tab = document.getElementById("Atab");
function renderTable() {
  const w = MESH.w[state.draw];
  let h = "<thead><tr><th scope=\"col\"></th>";
  for (let i = 0; i < N; i++) h += `<th scope="col">${i + 1}</th>`;
  h += "<th scope=\"col\" class=\"sum\">Σ</th><th scope=\"col\" class=\"z\">Z = A w</th></tr></thead><tbody>";
  state.pts.forEach((q, k) => {
    const r = Arow(q), sel = k === state.sel;
    const corners = r.L ? MESH.tv[r.L.tri] : [];
    const z = r.row.reduce((s, a, i) => s + a * w[i], 0);
    h += `<tr data-k="${k}" class="${sel ? "sel" : ""}"><th scope="row">s${sub(k + 1)}</th>`;
    r.row.forEach((a, i) => {
      if (a < 5e-4) { h += `<td class="zero">·</td>`; return; }
      const j = corners.indexOf(i);
      const tone = sel ? `var(${CORNER[j]})` : "var(--mesh)";
      h += `<td style="background: color-mix(in srgb, ${tone} ${Math.round(18 + 55 * a)}%, transparent); font-weight:${sel ? 600 : 400}">${a.toFixed(2)}</td>`;
    });
    h += `<td class="sum">${r.row.reduce((s, a) => s + a, 0).toFixed(2)}</td><td class="z">${fmt(z)}</td></tr>`;
  });
  h += `</tbody><tfoot><tr><th scope="row">w</th>${w.map(v => `<td>${fmt(v)}</td>`).join("")}<td class="sum"></td><td class="z"></td></tr></tfoot>`;
  tab.innerHTML = h;
  tab.querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("click", () => { state.sel = +tr.dataset.k; render(); }));
}
function renderReadouts() {
  const w = MESH.w[state.draw], p = state.pts[state.sel], r = Arow(p);
  const ro = document.getElementById("readout"), calc = document.getElementById("calc");
  if (!r.L) { ro.textContent = ""; calc.textContent = ""; return; }
  const c = MESH.tv[r.L.tri], v = r.L.w, s = "s" + sub(state.sel + 1);
  const terms = c.map((i, j) => `<span class="k${j + 1}">ψ${sub(i + 1)}(${s}) = ${v[j].toFixed(2)}</span>`).join(" + ");
  const z = c.reduce((t, i, j) => t + v[j] * w[i], 0);
  const ws = c.map((i, j) => `<span class="k${j + 1}">${v[j].toFixed(2)} × w${sub(i + 1)}</span>`).join(" + ");
  const wn = c.map((i, j) => `<span class="k${j + 1}">${v[j].toFixed(2)} × (${fmt(w[i])})</span>`).join(" + ");
  ro.innerHTML = state.mode === "basis"
    ? `${terms} = <span class="tot">${v.reduce((a, b) => a + b, 0).toFixed(2)}</span>`
    : `Z(${s}) = ${ws} = <span class="tot">${fmt(z)}</span>`;
  calc.innerHTML = `Row ${s} of A times w: Z(${s}) = ${wn} = <span class="tot">${fmt(z)}</span>`;
}
function render() { drawPlan(); draw3d(); renderTable(); renderReadouts(); }

/* ---------- Controls ---------- */
const bB = document.getElementById("modeBasis"), bF = document.getElementById("modeField");
function setMode(m) { state.mode = m; bB.setAttribute("aria-pressed", m === "basis"); bF.setAttribute("aria-pressed", m === "field"); render(); }
bB.addEventListener("click", () => setMode("basis"));
bF.addEventListener("click", () => setMode("field"));
document.getElementById("newDraw").addEventListener("click", () => { state.draw = (state.draw + 1) % MESH.w.length; if (state.mode !== "field") setMode("field"); else render(); });
document.getElementById("resetView").addEventListener("click", () => { state.az = -0.65; state.el = 0.6; draw3d(); });

new ResizeObserver(resize).observe(cv.parentElement);
const redraw = () => render();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw); } catch (e) {}
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
render();
</script>
</body>
</html>
